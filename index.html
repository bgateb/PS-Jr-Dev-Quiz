<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Junior Developer Quiz</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #15803d;
      --danger: #b91c1c;
      --border: #d1d5db;
      --soft: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.75rem;
    }

    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .question-title {
      font-size: 1.25rem;
      margin: 0 0 1rem;
    }

    .answers {
      display: grid;
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .answer {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      font-size: 1rem;
    }

    .answer:hover,
    .answer:focus {
      border-color: var(--primary);
      outline: none;
      background: var(--soft);
    }

    .answer.selected {
      border-color: var(--primary);
      background: var(--soft);
      font-weight: 700;
    }

    .answer.correct {
      border-color: var(--success);
      background: #dcfce7;
    }

    .answer.incorrect {
      border-color: var(--danger);
      background: #fee2e2;
    }

    .feedback {
      min-height: 2rem;
      margin: 1rem 0;
      font-weight: 700;
    }

    .feedback.success {
      color: var(--success);
    }

    .feedback.danger {
      color: var(--danger);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button.primary,
    button.secondary {
      border: 0;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    button.primary {
      background: var(--primary);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #e5e7eb;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      text-align: center;
    }

    .score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0.5rem 0;
    }

    .review-list {
      margin-top: 1.5rem;
      text-align: left;
      display: grid;
      gap: 1rem;
    }

    .review-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      background: #fafafa;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Junior Developer Quiz</h1>
    <p>A lightweight self-check quiz for junior developers.</p>
  </header>

  <main>
    <section id="quiz-card" class="card">
      <div class="toolbar">
        <div class="status" id="progress-text">Question 1 of 1</div>
        <div class="status" id="score-text">Score: 0</div>
      </div>

      <h2 class="question-title" id="question-text"></h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>

      <div class="actions">
        <button class="primary" id="submit-btn">Submit Answer</button>
        <button class="secondary" id="next-btn" disabled>Next Question</button>
      </div>
    </section>

    <section id="result-card" class="card result hidden">
      <h2>Quiz Complete</h2>
      <p class="score" id="final-score"></p>
      <p id="final-message"></p>
      <div class="actions" style="justify-content: center;">
        <button class="primary" id="restart-btn">Restart Quiz</button>
      </div>
      <div class="review-list" id="review-list"></div>
    </section>
  </main>

  <script>
    const quizQuestions = [
      {
        question: "What is the main purpose of version control?",
        answers: [
          "To make code run faster",
          "To track and manage changes to files over time",
          "To automatically fix bugs",
          "To replace code reviews"
        ],
        correctIndex: 1,
        explanation: "Version control helps teams track changes, collaborate safely, and recover previous versions when needed."
      },
      {
        question: "Which HTTP method is typically used to retrieve data?",
        answers: ["GET", "POST", "PATCH", "DELETE"],
        correctIndex: 0,
        explanation: "GET is used to request or retrieve data from a server."
      },
      {
        question: "What does a primary key do in a database table?",
        answers: [
          "Encrypts sensitive data",
          "Uniquely identifies each row",
          "Stores file attachments",
          "Improves screen layout"
        ],
        correctIndex: 1,
        explanation: "A primary key provides a unique identifier for each row in a table."
      },
      {
        question: "In PeopleCode-style thinking, why is null or blank validation important before processing data?",
        answers: [
          "It makes comments unnecessary",
          "It prevents bad assumptions and runtime issues",
          "It removes the need for testing",
          "It automatically improves SQL performance"
        ],
        correctIndex: 1,
        explanation: "Validation helps avoid incorrect processing, unexpected errors, and poor data quality."
      },
      {
        question: "What is the best first step when debugging an issue?",
        answers: [
          "Rewrite the entire module",
          "Make multiple fixes at once",
          "Reproduce the issue and isolate where it occurs",
          "Assume the user entered bad data"
        ],
        correctIndex: 2,
        explanation: "Good debugging starts by reproducing the issue, narrowing the scope, and validating one thing at a time."
      }
    ];

    let currentQuestionIndex = 0;
    let selectedAnswerIndex = null;
    let score = 0;
    let submitted = false;
    const review = [];

    const quizCard = document.getElementById("quiz-card");
    const resultCard = document.getElementById("result-card");
    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const questionText = document.getElementById("question-text");
    const answersContainer = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const submitButton = document.getElementById("submit-btn");
    const nextButton = document.getElementById("next-btn");
    const restartButton = document.getElementById("restart-btn");
    const finalScore = document.getElementById("final-score");
    const finalMessage = document.getElementById("final-message");
    const reviewList = document.getElementById("review-list");

    function renderQuestion() {
      const currentQuestion = quizQuestions[currentQuestionIndex];
      selectedAnswerIndex = null;
      submitted = false;

      progressText.textContent = `Question ${currentQuestionIndex + 1} of ${quizQuestions.length}`;
      scoreText.textContent = `Score: ${score}`;
      questionText.textContent = currentQuestion.question;
      feedback.textContent = "";
      feedback.className = "feedback";
      answersContainer.innerHTML = "";
      submitButton.disabled = false;
      nextButton.disabled = true;
      nextButton.textContent = currentQuestionIndex === quizQuestions.length - 1 ? "View Results" : "Next Question";

      currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.textContent = answer;
        button.addEventListener("click", () => selectAnswer(index));
        answersContainer.appendChild(button);
      });
    }

    function selectAnswer(index) {
      if (submitted) return;

      selectedAnswerIndex = index;
      const answerButtons = document.querySelectorAll(".answer");

      answerButtons.forEach((button, buttonIndex) => {
        button.classList.toggle("selected", buttonIndex === index);
      });
    }

    function submitAnswer() {
      if (selectedAnswerIndex === null) {
        feedback.textContent = "Please select an answer before submitting.";
        feedback.className = "feedback danger";
        return;
      }

      const currentQuestion = quizQuestions[currentQuestionIndex];
      const isCorrect = selectedAnswerIndex === currentQuestion.correctIndex;
      const answerButtons = document.querySelectorAll(".answer");

      submitted = true;
      submitButton.disabled = true;
      nextButton.disabled = false;

      answerButtons.forEach((button, index) => {
        if (index === currentQuestion.correctIndex) {
          button.classList.add("correct");
        }

        if (index === selectedAnswerIndex && !isCorrect) {
          button.classList.add("incorrect");
        }
      });

      if (isCorrect) {
        score += 1;
        feedback.textContent = `Correct. ${currentQuestion.explanation}`;
        feedback.className = "feedback success";
      } else {
        feedback.textContent = `Incorrect. ${currentQuestion.explanation}`;
        feedback.className = "feedback danger";
      }

      scoreText.textContent = `Score: ${score}`;

      review.push({
        question: currentQuestion.question,
        selectedAnswer: currentQuestion.answers[selectedAnswerIndex],
        correctAnswer: currentQuestion.answers[currentQuestion.correctIndex],
        isCorrect,
        explanation: currentQuestion.explanation
      });
    }

    function goToNextQuestion() {
      if (currentQuestionIndex < quizQuestions.length - 1) {
        currentQuestionIndex += 1;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      quizCard.classList.add("hidden");
      resultCard.classList.remove("hidden");

      const percentage = Math.round((score / quizQuestions.length) * 100);
      finalScore.textContent = `${score} / ${quizQuestions.length} (${percentage}%)`;

      if (percentage >= 80) {
        finalMessage.textContent = "Strong result. Ready for the next level of practice.";
      } else if (percentage >= 60) {
        finalMessage.textContent = "Good start. Review the missed items and try again.";
      } else {
        finalMessage.textContent = "Keep practicing. Focus on the explanations before retaking the quiz.";
      }

      reviewList.innerHTML = "";

      review.forEach((item, index) => {
        const reviewItem = document.createElement("div");
        reviewItem.className = "review-item";
        reviewItem.innerHTML = `
          <strong>${index + 1}. ${item.question}</strong>
          <p>Your answer: ${item.selectedAnswer}</p>
          <p>Correct answer: ${item.correctAnswer}</p>
          <p>${item.isCorrect ? "Correct" : "Incorrect"}</p>
          <p>${item.explanation}</p>
        `;
        reviewList.appendChild(reviewItem);
      });
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      selectedAnswerIndex = null;
      score = 0;
      submitted = false;
      review.length = 0;
      resultCard.classList.add("hidden");
      quizCard.classList.remove("hidden");
      renderQuestion();
    }

    submitButton.addEventListener("click", submitAnswer);
    nextButton.addEventListener("click", goToNextQuestion);
    restartButton.addEventListener("click", restartQuiz);

    renderQuestion();
  </script>
</body>
</html>
