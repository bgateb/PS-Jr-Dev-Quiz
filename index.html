<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Junior Developer Quiz</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #15803d;
      --danger: #b91c1c;
      --border: #d1d5db;
      --soft: #eef2ff;
      --code-bg: #111827;
      --code-text: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.75rem;
    }

    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .reference-card h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }

    .reference-card img {
      width: 100%;
      border-radius: 8px;
      display: block;
      margin-bottom: 1rem;
    }

    .reference-card pre {
      max-height: 500px;
      overflow-y: auto;
    }

    .hljs {
      background: transparent;
    }

    .reference-note {
      color: var(--muted);
      font-size: 0.95rem;
    }

    pre {
      background: var(--code-bg);
      color: var(--code-text);
      padding: 1rem;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre;
      font-size: 0.9rem;
    }

    code {
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .question-title {
      font-size: 1.25rem;
      margin: 0 0 1rem;
    }

    .question-instructions {
      margin-top: -0.25rem;
      color: var(--muted);
    }

    .answers {
      display: grid;
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .answer {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      font-size: 1rem;
    }

    .answer:hover,
    .answer:focus {
      border-color: var(--primary);
      outline: none;
      background: var(--soft);
    }

    .answer.selected {
      border-color: var(--primary);
      background: var(--soft);
      font-weight: 700;
    }

    .answer.correct {
      border-color: var(--success);
      background: #dcfce7;
    }

    .answer.incorrect {
      border-color: var(--danger);
      background: #fee2e2;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .feedback {
      min-height: 2rem;
      margin: 1rem 0;
      font-weight: 700;
    }

    .feedback.success {
      color: var(--success);
    }

    .feedback.danger {
      color: var(--danger);
    }

    .feedback.neutral {
      color: var(--text);
      font-weight: 400;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button.primary,
    button.secondary {
      border: 0;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    button.primary {
      background: var(--primary);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #e5e7eb;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      text-align: center;
    }

    .score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0.5rem 0;
    }

    .review-list {
      margin-top: 1.5rem;
      text-align: left;
      display: grid;
      gap: 1rem;
    }

    .review-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      background: #fafafa;
    }

    .review-item p {
      margin: 0.35rem 0;
    }

    .hidden {
      display: none;
    }

  </style>
</head>
<body>
  <header>
    <h1>Junior Developer Quiz</h1>
    <p>A lightweight self-check quiz for junior developers.</p>
  </header>

  <main>
    <div class="layout">
      <aside class="card reference-card">
        <h2>Reference</h2>
        <p class="reference-note" id="reference-note">Code snippets shown here stay visible while you answer the related question.</p>
        <div id="reference-content"></div>
      </aside>

      <section id="quiz-card" class="card">
        <div class="toolbar">
          <div class="status" id="progress-text">Question 1 of 1</div>
          <div class="status" id="score-text">Auto-graded score: 0</div>
        </div>

        <h2 class="question-title" id="question-text"></h2>
        <p class="question-instructions" id="question-instructions"></p>
        <div class="answers" id="answers"></div>
        <div id="short-answer-container" class="hidden">
          <textarea id="short-answer" placeholder="Type your answer here..."></textarea>
        </div>
        <div class="feedback" id="feedback"></div>

        <div class="actions">
          <button class="primary" id="submit-btn">Submit Answer</button>
          <button class="secondary" id="next-btn" disabled>Next Question</button>
        </div>
      </section>
    </div>

    <section id="result-card" class="card result hidden">
      <h2>Quiz Complete</h2>
      <p class="score" id="final-score"></p>
      <p id="final-message"></p>
      <div class="actions" style="justify-content: center;">
        <button class="primary" id="restart-btn">Restart Quiz</button>
      </div>
      <div class="review-list" id="review-list"></div>
    </section>
  </main>

  <script>
    const referenceSnippets = {
      contactValidation: {
        title: "SIMPLE DATA VALIDATION — Component.SavePreChange",
        language: "PeopleCode",
        code: `Local Rowset &rs0, &rs1, &rs2;
Local Row &row2;
Local number &i, &j, &primaryCount;
Local string &contactType, &contactVal;

&rs0 = GetLevel0();
&rs1 = &rs0(1).GetRowset(Scroll.CSU_JD_BG_HDR);

For &i = 1 To &rs1.ActiveRowCount

   &rs2 = &rs1(&i).GetRowset(Scroll.CSU_JD_BG_CNTCT);
   &primaryCount = 0;

   For &j = 1 To &rs2.ActiveRowCount

      &row2 = &rs2(&j);

      &contactType = &row2.CSU_JD_BG_CNTCT.CSU_JD_CNTCT_TYPE.Value;
      &contactVal = LTrim(RTrim(&row2.CSU_JD_BG_CNTCT.CSU_JD_CONTACT_VAL.Value));

      If &row2.CSU_JD_BG_CNTCT.CSU_JD_PRIMARY.Value = "Y" Then
         &primaryCount = &primaryCount + 1;
            If &primaryCount > 1 Then
        Error ("Only one primary contact is allowed for each header row.");
      End-If;
      End-If;

      If All(&contactType) And None(&contactVal) Then
         Error ("Contact Value is required when Contact Type is entered.");
      End-If;

      If All(&contactVal) And None(&contactType) Then
         Error ("Contact Type is required when Contact Value is entered.");
      End-If;

      If All(&contactVal) Then Evaluate &contactType
         When = "E" /* Email */
            If Find("@", &contactVal) = 0 Then
               Error ("Enter a valid email address.");
            End-If;

         When = "P" /* Phone */
            If Not IsNumber(&contactVal) Then
               Error ("Phone number must be numeric.");
            End-If;

         When = "F" /* Fax */
            If Not IsNumber(&contactVal) Then
               Error ("Fax number must be numeric.");
            End-If;

         When = "X" /* X / Twitter */
            If Find("@", &contactVal) = 0 Then
               Error ("Enter a valid X handle.");
            End-If;
         When-Other
            Warning ("Unknown contact type: " | &contactType);
         End-Evaluate;
      End-If;
   End-For;
End-For;`
      }
    };

    let quizQuestions = [];

    let currentQuestionIndex = 0;
    let selectedAnswerIndex = null;
    let score = 0;
    let submitted = false;
    const review = [];

    const quizCard = document.getElementById("quiz-card");
    const resultCard = document.getElementById("result-card");
    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const questionText = document.getElementById("question-text");
    const questionInstructions = document.getElementById("question-instructions");
    const answersContainer = document.getElementById("answers");
    const shortAnswerContainer = document.getElementById("short-answer-container");
    const shortAnswer = document.getElementById("short-answer");
    const feedback = document.getElementById("feedback");
    const submitButton = document.getElementById("submit-btn");
    const nextButton = document.getElementById("next-btn");
    const restartButton = document.getElementById("restart-btn");
    const finalScore = document.getElementById("final-score");
    const finalMessage = document.getElementById("final-message");
    const reviewList = document.getElementById("review-list");
    const referenceContent = document.getElementById("reference-content");

    function normalizeText(value) {
      return value
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function renderQuestion() {
      const currentQuestion = quizQuestions[currentQuestionIndex];
      selectedAnswerIndex = null;
      submitted = false;

      progressText.textContent = `Question ${currentQuestionIndex + 1} of ${quizQuestions.length}`;
      scoreText.textContent = `Auto-graded score: ${score}`;
      questionText.textContent = currentQuestion.question;
      questionInstructions.textContent = currentQuestion.instructions || "";
      feedback.textContent = "";
      feedback.className = "feedback";
      answersContainer.innerHTML = "";
      shortAnswer.value = "";
      submitButton.disabled = false;
      nextButton.disabled = true;
      nextButton.textContent = currentQuestionIndex === quizQuestions.length - 1 ? "View Results" : "Next Question";

      if (currentQuestion.type === "multipleChoice") {
        answersContainer.classList.remove("hidden");
        shortAnswerContainer.classList.add("hidden");
        renderMultipleChoiceAnswers(currentQuestion);
      } else if (currentQuestion.type === "shortAnswer") {
        answersContainer.classList.add("hidden");
        shortAnswerContainer.classList.remove("hidden");
      }
    }

    function renderMultipleChoiceAnswers(currentQuestion) {
      currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.textContent = answer;
        button.addEventListener("click", () => selectAnswer(index));
        answersContainer.appendChild(button);
      });
    }

    function renderReferences() {
      const snippet = referenceSnippets.contactValidation;
      referenceContent.innerHTML = `
        <img src="img/component-screenshot.png" alt="CSU Training Contact Info component showing Level 0, Level 1 Scroll, and Level 2 Scroll" />
        <h3>${snippet.title}</h3>
        <p class="reference-note">${snippet.language}</p>
        <pre><code class="language-java">${escapeHtml(snippet.code)}</code></pre>
      `;
      hljs.highlightElement(referenceContent.querySelector('code'));
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function selectAnswer(index) {
      if (submitted) return;

      selectedAnswerIndex = index;
      const answerButtons = document.querySelectorAll(".answer");

      answerButtons.forEach((button, buttonIndex) => {
        button.classList.toggle("selected", buttonIndex === index);
      });
    }

    function submitAnswer() {
      const currentQuestion = quizQuestions[currentQuestionIndex];

      if (currentQuestion.type === "multipleChoice") {
        submitMultipleChoice(currentQuestion);
      } else if (currentQuestion.type === "shortAnswer") {
        submitShortAnswer(currentQuestion);
      }
    }

    function submitMultipleChoice(currentQuestion) {
      if (selectedAnswerIndex === null) {
        feedback.textContent = "Please select an answer before submitting.";
        feedback.className = "feedback danger";
        return;
      }

      const isCorrect = selectedAnswerIndex === currentQuestion.correctIndex;
      const answerButtons = document.querySelectorAll(".answer");

      submitted = true;
      submitButton.disabled = true;
      nextButton.disabled = false;

      answerButtons.forEach((button, index) => {
        if (index === currentQuestion.correctIndex) button.classList.add("correct");
        if (index === selectedAnswerIndex && !isCorrect) button.classList.add("incorrect");
      });

      if (isCorrect) {
        score += 1;
        feedback.textContent = `Correct. ${currentQuestion.explanation}`;
        feedback.className = "feedback success";
      } else {
        feedback.textContent = `Incorrect. ${currentQuestion.explanation}`;
        feedback.className = "feedback danger";
      }

      scoreText.textContent = `Auto-graded score: ${score}`;

      review.push({
        type: currentQuestion.type,
        question: currentQuestion.question,
        selectedAnswer: currentQuestion.answers[selectedAnswerIndex],
        correctAnswer: currentQuestion.answers[currentQuestion.correctIndex],
        isCorrect,
        explanation: currentQuestion.explanation
      });
    }

    function submitShortAnswer(currentQuestion) {
      const userAnswer = shortAnswer.value.trim();

      if (!userAnswer) {
        feedback.textContent = "Please enter a response before submitting.";
        feedback.className = "feedback danger";
        return;
      }

      const normalizedAnswer = normalizeText(userAnswer);
      const acceptedAnswers = (currentQuestion.acceptedAnswers || []).map(normalizeText);
      const requiredKeywords = (currentQuestion.keywords || []).map(normalizeText);

      const matchesAcceptedAnswer = acceptedAnswers.some((acceptedAnswer) => normalizedAnswer.includes(acceptedAnswer));
      const includesRequiredKeywords = requiredKeywords.every((keyword) => normalizedAnswer.includes(keyword));
      const isCorrect = matchesAcceptedAnswer || includesRequiredKeywords;

      submitted = true;
      submitButton.disabled = true;
      nextButton.disabled = false;
      shortAnswer.disabled = true;

      if (isCorrect) {
        score += 1;
        feedback.textContent = `Accepted. ${currentQuestion.explanation}`;
        feedback.className = "feedback success";
      } else {
        feedback.textContent = `Needs review. ${currentQuestion.explanation}`;
        feedback.className = "feedback neutral";
      }

      scoreText.textContent = `Auto-graded score: ${score}`;

      review.push({
        type: currentQuestion.type,
        question: currentQuestion.question,
        selectedAnswer: userAnswer,
        correctAnswer: currentQuestion.acceptedAnswers ? currentQuestion.acceptedAnswers.join("; ") : "Instructor review recommended",
        isCorrect,
        explanation: currentQuestion.explanation
      });
    }

    function goToNextQuestion() {
      shortAnswer.disabled = false;

      if (currentQuestionIndex < quizQuestions.length - 1) {
        currentQuestionIndex += 1;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      quizCard.classList.add("hidden");
      document.querySelector(".reference-card").classList.add("hidden");
      resultCard.classList.remove("hidden");

      const percentage = Math.round((score / quizQuestions.length) * 100);
      finalScore.textContent = `${score} / ${quizQuestions.length} (${percentage}%)`;
      finalMessage.textContent = "Short-answer questions are auto-checked with simple matching. Review responses manually when precision matters.";

      reviewList.innerHTML = "";

      review.forEach((item, index) => {
        const reviewItem = document.createElement("div");
        reviewItem.className = "review-item";
        reviewItem.innerHTML = `
          <strong>${index + 1}. ${escapeHtml(item.question)}</strong>
          <p><strong>Response:</strong> ${escapeHtml(item.selectedAnswer)}</p>
          <p><strong>Expected:</strong> ${escapeHtml(item.correctAnswer)}</p>
          <p><strong>Status:</strong> ${item.isCorrect ? "Accepted" : "Needs review"}</p>
          <p>${escapeHtml(item.explanation)}</p>
        `;
        reviewList.appendChild(reviewItem);
      });
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      selectedAnswerIndex = null;
      score = 0;
      submitted = false;
      review.length = 0;
      shortAnswer.disabled = false;
      resultCard.classList.add("hidden");
      document.querySelector(".reference-card").classList.remove("hidden");
      quizCard.classList.remove("hidden");
      renderQuestion();
    }

    submitButton.addEventListener("click", submitAnswer);
    nextButton.addEventListener("click", goToNextQuestion);
    restartButton.addEventListener("click", restartQuiz);

    fetch('questions.json')
      .then(r => r.json())
      .then(questions => {
        quizQuestions = questions;
        renderReferences();
        renderQuestion();
      })
      .catch(() => {
        document.getElementById('quiz-card').innerHTML = '<p style="color:var(--danger);padding:1rem">Failed to load questions. Please reload the page.</p>';
      });
  </script>
</body>
</html>
