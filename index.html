<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Junior Developer Quiz</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #15803d;
      --danger: #b91c1c;
      --border: #d1d5db;
      --soft: #eef2ff;
      --code-bg: #111827;
      --code-text: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.75rem;
    }

    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
    }

    .reference-card h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }

    .reference-card img {
      width: 100%;
      border-radius: 8px;
      display: block;
      margin-bottom: 1rem;
    }

    .reference-card pre {
      max-height: 320px;
      overflow-y: auto;
    }

    .reference-note {
      color: var(--muted);
      font-size: 0.95rem;
    }

    pre {
      background: var(--code-bg);
      color: var(--code-text);
      padding: 1rem;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre;
      font-size: 0.9rem;
    }

    code {
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .question-title {
      font-size: 1.25rem;
      margin: 0 0 1rem;
    }

    .question-instructions {
      margin-top: -0.25rem;
      color: var(--muted);
    }

    .answers {
      display: grid;
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .answer {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      font-size: 1rem;
    }

    .answer:hover,
    .answer:focus {
      border-color: var(--primary);
      outline: none;
      background: var(--soft);
    }

    .answer.selected {
      border-color: var(--primary);
      background: var(--soft);
      font-weight: 700;
    }

    .answer.correct {
      border-color: var(--success);
      background: #dcfce7;
    }

    .answer.incorrect {
      border-color: var(--danger);
      background: #fee2e2;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      resize: vertical;
    }

    textarea:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .feedback {
      min-height: 2rem;
      margin: 1rem 0;
      font-weight: 700;
    }

    .feedback.success {
      color: var(--success);
    }

    .feedback.danger {
      color: var(--danger);
    }

    .feedback.neutral {
      color: var(--text);
      font-weight: 400;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button.primary,
    button.secondary {
      border: 0;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    button.primary {
      background: var(--primary);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #e5e7eb;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      text-align: center;
    }

    .score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0.5rem 0;
    }

    .review-list {
      margin-top: 1.5rem;
      text-align: left;
      display: grid;
      gap: 1rem;
    }

    .review-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      background: #fafafa;
    }

    .review-item p {
      margin: 0.35rem 0;
    }

    .hidden {
      display: none;
    }

  </style>
</head>
<body>
  <header>
    <h1>Junior Developer Quiz</h1>
    <p>A lightweight self-check quiz for junior developers.</p>
  </header>

  <main>
    <div class="layout">
      <aside class="card reference-card">
        <h2>Reference</h2>
        <p class="reference-note" id="reference-note">Code snippets shown here stay visible while you answer the related question.</p>
        <div id="reference-content"></div>
      </aside>

      <section id="quiz-card" class="card">
        <div class="toolbar">
          <div class="status" id="progress-text">Question 1 of 1</div>
          <div class="status" id="score-text">Auto-graded score: 0</div>
        </div>

        <h2 class="question-title" id="question-text"></h2>
        <p class="question-instructions" id="question-instructions"></p>
        <div class="answers" id="answers"></div>
        <div id="short-answer-container" class="hidden">
          <textarea id="short-answer" placeholder="Type your answer here..."></textarea>
        </div>
        <div class="feedback" id="feedback"></div>

        <div class="actions">
          <button class="primary" id="submit-btn">Submit Answer</button>
          <button class="secondary" id="next-btn" disabled>Next Question</button>
        </div>
      </section>
    </div>

    <section id="result-card" class="card result hidden">
      <h2>Quiz Complete</h2>
      <p class="score" id="final-score"></p>
      <p id="final-message"></p>
      <div class="actions" style="justify-content: center;">
        <button class="primary" id="restart-btn">Restart Quiz</button>
      </div>
      <div class="review-list" id="review-list"></div>
    </section>
  </main>

  <script>
    const referenceSnippets = {
      contactValidation: {
        title: "SIMPLE DATA VALIDATION — Component.SavePreChange",
        language: "PeopleCode",
        code: `Local Rowset &rs0, &rs1, &rs2;
Local Row &row2;
Local number &i, &j, &primaryCount;
Local string &contactType, &contactVal;

&rs0 = GetLevel0();
&rs1 = &rs0(1).GetRowset(Scroll.CSU_JD_BG_HDR);

For &i = 1 To &rs1.ActiveRowCount

   &rs2 = &rs1(&i).GetRowset(Scroll.CSU_JD_BG_CNTCT);
   &primaryCount = 0;

   For &j = 1 To &rs2.ActiveRowCount

      &row2 = &rs2(&j);

      &contactType = &row2.CSU_JD_BG_CNTCT.CSU_JD_CNTCT_TYPE.Value;
      &contactVal = LTrim(RTrim(&row2.CSU_JD_BG_CNTCT.CSU_JD_CONTACT_VAL.Value));

      If &row2.CSU_JD_BG_CNTCT.CSU_JD_PRIMARY.Value = "Y" Then
         &primaryCount = &primaryCount + 1;
            If &primaryCount > 1 Then
        Error ("Only one primary contact is allowed for each header row.");
      End-If;
      End-If;

      If All(&contactType) And None(&contactVal) Then
         Error ("Contact Value is required when Contact Type is entered.");
      End-If;

      If All(&contactVal) And None(&contactType) Then
         Error ("Contact Type is required when Contact Value is entered.");
      End-If;

      If All(&contactVal) Then Evaluate &contactType
         When = "E" /* Email */
            If Find("@", &contactVal) = 0 Then
               Error ("Enter a valid email address.");
            End-If;

         When = "P" /* Phone */
            If Not IsNumber(&contactVal) Then
               Error ("Phone number must be numeric.");
            End-If;

         When = "F" /* Fax */
            If Not IsNumber(&contactVal) Then
               Error ("Fax number must be numeric.");
            End-If;

         When = "X" /* X / Twitter */
            If Find("@", &contactVal) = 0 Then
               Error ("Enter a valid X handle.");
            End-If;
         When-Other
            Warning ("Unknown contact type: " | &contactType);
         End-Evaluate;
      End-If;
   End-For;
End-For;`
      }
    };

    const quizQuestions = [
      {
        type: "shortAnswer",
        question: "What does GetLevel0() return?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
        acceptedAnswers: [
          "level 0 rowset",
          "the level 0 rowset",
          "rowset for level 0",
          "component buffer level 0",
          "rowset representing level 0"
        ],
        keywords: ["rowset"],
        explanation: "GetLevel0() returns the Level 0 rowset — the top of the component buffer, which always contains exactly one row."
      },
      {
        type: "shortAnswer",
        question: "What is the difference between a rowset and a row?",
        instructions: "Answer in one or two sentences. This question is auto-graded by keyword matching.",
        acceptedAnswers: [
          "rowset is a collection of rows",
          "rowset contains rows",
          "a rowset holds multiple rows",
          "a row is a single record in a rowset"
        ],
        keywords: ["rowset", "row"],
        explanation: "A rowset is a collection (container) of rows. A row is a single record within that rowset, and it can contain records and child rowsets."
      },
      {
        type: "shortAnswer",
        question: "What does Row.Record.Field.Value represent? In other words, what does it translate to when speaking in a PeopleCode context?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
        acceptedAnswers: [
          "value of a field in a record on a row",
          "the data stored in a specific field",
          "actual data in a field on the component buffer",
          "the field value from a record on that row"
        ],
        keywords: ["value", "field"],
        explanation: "Row.Record.Field.Value navigates from a row object, to a specific record on that row, to a specific field on that record, and then reads or sets its current value in the component buffer."
      },
      {
        type: "shortAnswer",
        question: "When declaring a variable for a level 0 rowset such as Local Rowset &rs0 = GetLevel0(); — why would we use the syntax &rs0(1) to begin traversing the buffer?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "level 0 always has one row",
          "level 0 has exactly one row",
          "only one row at level 0",
          "the level 0 rowset always contains a single row",
          "there is only ever one row at level 0"
        ],
        keywords: ["one row"],
        explanation: "Level 0 always contains exactly one row — the component header row. So &rs0(1) is the only valid index, and it gives you the single row from which you can call GetRowset() to reach Level 1."
      },
      {
        type: "shortAnswer",
        question: "What does the ActiveRowCount property tell us?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "number of active rows in the rowset",
          "how many active rows exist",
          "count of active rows",
          "the number of non-deleted rows in the rowset"
        ],
        keywords: ["active", "rows"],
        explanation: "ActiveRowCount returns the number of active (non-deleted) rows currently in the rowset. It's used as the upper bound when looping through rows."
      },
      {
        type: "shortAnswer",
        question: "Why can't we retrieve the Level 2 contact rowset directly from GetLevel0()?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "level 2 is a child of level 1",
          "level 2 is nested under level 1",
          "you must go through level 1 first",
          "level 2 is not directly under level 0",
          "the scroll hierarchy requires going through level 1"
        ],
        keywords: ["level 1"],
        explanation: "Level 2 is a child of Level 1, not Level 0. The component buffer is a hierarchy — you must traverse each level in order. You get Level 1 from Level 0, then Level 2 from a Level 1 row."
      },
      {
        type: "shortAnswer",
        question: "In the expression &rs1(&i).GetRowset(...), what does &rs1(&i) return?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "a row",
          "a row object",
          "the row at index i",
          "returns a row at position i",
          "row object at index i"
        ],
        keywords: ["row"],
        explanation: "&rs1(&i) returns the Row object at position i within the rowset. You can then call methods like GetRowset() or GetRecord() on that row object."
      },
      {
        type: "shortAnswer",
        question: "Why is the &rs2 rowset retrieved inside the Level 1 loop?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "each level 1 row has its own level 2 rowset",
          "different for each level 1 row",
          "level 2 rows belong to a specific level 1 row",
          "each iteration has a different parent row"
        ],
        keywords: ["each", "level 1"],
        explanation: "Each Level 1 row has its own child Level 2 rowset. By retrieving &rs2 inside the loop on each iteration, we always get the Level 2 contacts that belong specifically to &rs1(&i) — the current Level 1 row."
      },
      {
        type: "shortAnswer",
        question: "What would be wrong with retrieving &rs2 only once before the Level 1 loop?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "would only get contacts for the first level 1 row",
          "only sees contacts for one effdt row",
          "misses level 2 rows for other level 1 rows",
          "only retrieves contacts belonging to the first level 1 row"
        ],
        keywords: ["first", "only"],
        explanation: "If &rs2 were retrieved once before the loop, it would be fixed to the Level 2 rowset of one specific Level 1 row (likely the first). All iterations would validate the same contact data, missing contacts on other Level 1 rows entirely."
      },
      {
        type: "shortAnswer",
        question: "What happens in the code if the component has multiple Level 1 (i.e. multiple EFFDT) rows?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "loop iterates over each one",
          "processes each level 1 row",
          "validation runs for each effdt row",
          "the for loop runs once for each effdt row"
        ],
        keywords: ["each", "loop"],
        explanation: "The For loop runs once per active Level 1 row. If there are three EFFDT rows, the loop runs three times — each time retrieving and validating the Level 2 contact data for that specific effective-dated row."
      },
      {
        type: "shortAnswer",
        question: "Conceptually, how does the component know which Level 2 contact rows belong under a specific Level 1 header row?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "getrowset is called on the parent row",
          "level 2 is retrieved from the parent row object",
          "calling getrowset on a specific level 1 row returns its children",
          "the row object knows its own child rowset"
        ],
        keywords: ["parent", "row"],
        explanation: "GetRowset() is called on a specific Level 1 row object (&rs1(&i)). The row object inherently knows its own child rowsets — so the result is always the Level 2 rows that are children of that particular Level 1 row."
      },
      {
        type: "shortAnswer",
        question: "Why is &primaryCount initialized inside the Level 1 loop? In other words, why is it scoped to each Level 1 row, and why is the validation for &primaryCount > 1 placed after the Level 2 loop?",
        instructions: "Answer in one or two sentences. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "resets for each level 1 row",
          "separate count per level 1 row",
          "starts at zero for each effdt row",
          "each level 1 row gets its own fresh count"
        ],
        keywords: ["reset", "each"],
        explanation: "&primaryCount is reset to 0 at the start of each Level 1 iteration so the count is specific to that row's contacts. The validation runs after the Level 2 loop because we need to finish counting all contacts for that row before we can determine if there is more than one primary."
      },
      {
        type: "shortAnswer",
        question: "Why is SavePreChange a reasonable PeopleCode event for this data validation, and what is the difference between what we're doing here (validating the data in the buffer) versus validating in the database?",
        instructions: "Answer in one or two sentences. This question is auto-graded by keyword matching.",
acceptedAnswers: [
          "runs before data is saved to the database",
          "fires before data is written to the database",
          "catches errors before committing to the database",
          "validates before the database write occurs"
        ],
        keywords: ["before", "save"],
        explanation: "SavePreChange fires after the user clicks Save but before any SQL is written to the database. Validating in the buffer means we're checking the component's in-memory state — it's faster and prevents a round-trip, but the database could still be modified directly by other means (batch, SQL) that bypass this event."
      },
      {
        type: "shortAnswer",
        question: "When might FieldEdit or FieldChange be better than SavePreChange?",
        instructions: "Answer briefly. This question is auto-graded by keyword matching.",
        acceptedAnswers: [
          "immediate feedback to the user",
          "when you want real-time validation",
          "as the user enters data",
          "when you want to catch the error before the user moves to the next field"
        ],
        keywords: ["immediate", "field"],
        explanation: "FieldEdit and FieldChange fire as the user interacts with a specific field, giving immediate feedback before the user moves on. They're better when you want to validate a single field in real time rather than waiting until the user attempts to save the entire component."
      }
    ];

    let currentQuestionIndex = 0;
    let selectedAnswerIndex = null;
    let score = 0;
    let submitted = false;
    const review = [];

    const quizCard = document.getElementById("quiz-card");
    const resultCard = document.getElementById("result-card");
    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const questionText = document.getElementById("question-text");
    const questionInstructions = document.getElementById("question-instructions");
    const answersContainer = document.getElementById("answers");
    const shortAnswerContainer = document.getElementById("short-answer-container");
    const shortAnswer = document.getElementById("short-answer");
    const feedback = document.getElementById("feedback");
    const submitButton = document.getElementById("submit-btn");
    const nextButton = document.getElementById("next-btn");
    const restartButton = document.getElementById("restart-btn");
    const finalScore = document.getElementById("final-score");
    const finalMessage = document.getElementById("final-message");
    const reviewList = document.getElementById("review-list");
    const referenceContent = document.getElementById("reference-content");

    function normalizeText(value) {
      return value
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function renderQuestion() {
      const currentQuestion = quizQuestions[currentQuestionIndex];
      selectedAnswerIndex = null;
      submitted = false;

      progressText.textContent = `Question ${currentQuestionIndex + 1} of ${quizQuestions.length}`;
      scoreText.textContent = `Auto-graded score: ${score}`;
      questionText.textContent = currentQuestion.question;
      questionInstructions.textContent = currentQuestion.instructions || "";
      feedback.textContent = "";
      feedback.className = "feedback";
      answersContainer.innerHTML = "";
      shortAnswer.value = "";
      submitButton.disabled = false;
      nextButton.disabled = true;
      nextButton.textContent = currentQuestionIndex === quizQuestions.length - 1 ? "View Results" : "Next Question";

      if (currentQuestion.type === "multipleChoice") {
        answersContainer.classList.remove("hidden");
        shortAnswerContainer.classList.add("hidden");
        renderMultipleChoiceAnswers(currentQuestion);
      } else if (currentQuestion.type === "shortAnswer") {
        answersContainer.classList.add("hidden");
        shortAnswerContainer.classList.remove("hidden");
      }
    }

    function renderMultipleChoiceAnswers(currentQuestion) {
      currentQuestion.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.textContent = answer;
        button.addEventListener("click", () => selectAnswer(index));
        answersContainer.appendChild(button);
      });
    }

    function renderReferences() {
      const snippet = referenceSnippets.contactValidation;
      referenceContent.innerHTML = `
        <img src="img/component-screenshot.png" alt="CSU Training Contact Info component showing Level 0, Level 1 Scroll, and Level 2 Scroll" />
        <h3>${snippet.title}</h3>
        <p class="reference-note">${snippet.language}</p>
        <pre><code>${escapeHtml(snippet.code)}</code></pre>
      `;
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function selectAnswer(index) {
      if (submitted) return;

      selectedAnswerIndex = index;
      const answerButtons = document.querySelectorAll(".answer");

      answerButtons.forEach((button, buttonIndex) => {
        button.classList.toggle("selected", buttonIndex === index);
      });
    }

    function submitAnswer() {
      const currentQuestion = quizQuestions[currentQuestionIndex];

      if (currentQuestion.type === "multipleChoice") {
        submitMultipleChoice(currentQuestion);
      } else if (currentQuestion.type === "shortAnswer") {
        submitShortAnswer(currentQuestion);
      }
    }

    function submitMultipleChoice(currentQuestion) {
      if (selectedAnswerIndex === null) {
        feedback.textContent = "Please select an answer before submitting.";
        feedback.className = "feedback danger";
        return;
      }

      const isCorrect = selectedAnswerIndex === currentQuestion.correctIndex;
      const answerButtons = document.querySelectorAll(".answer");

      submitted = true;
      submitButton.disabled = true;
      nextButton.disabled = false;

      answerButtons.forEach((button, index) => {
        if (index === currentQuestion.correctIndex) button.classList.add("correct");
        if (index === selectedAnswerIndex && !isCorrect) button.classList.add("incorrect");
      });

      if (isCorrect) {
        score += 1;
        feedback.textContent = `Correct. ${currentQuestion.explanation}`;
        feedback.className = "feedback success";
      } else {
        feedback.textContent = `Incorrect. ${currentQuestion.explanation}`;
        feedback.className = "feedback danger";
      }

      scoreText.textContent = `Auto-graded score: ${score}`;

      review.push({
        type: currentQuestion.type,
        question: currentQuestion.question,
        selectedAnswer: currentQuestion.answers[selectedAnswerIndex],
        correctAnswer: currentQuestion.answers[currentQuestion.correctIndex],
        isCorrect,
        explanation: currentQuestion.explanation
      });
    }

    function submitShortAnswer(currentQuestion) {
      const userAnswer = shortAnswer.value.trim();

      if (!userAnswer) {
        feedback.textContent = "Please enter a response before submitting.";
        feedback.className = "feedback danger";
        return;
      }

      const normalizedAnswer = normalizeText(userAnswer);
      const acceptedAnswers = (currentQuestion.acceptedAnswers || []).map(normalizeText);
      const requiredKeywords = (currentQuestion.keywords || []).map(normalizeText);

      const matchesAcceptedAnswer = acceptedAnswers.some((acceptedAnswer) => normalizedAnswer.includes(acceptedAnswer));
      const includesRequiredKeywords = requiredKeywords.every((keyword) => normalizedAnswer.includes(keyword));
      const isCorrect = matchesAcceptedAnswer || includesRequiredKeywords;

      submitted = true;
      submitButton.disabled = true;
      nextButton.disabled = false;
      shortAnswer.disabled = true;

      if (isCorrect) {
        score += 1;
        feedback.textContent = `Accepted. ${currentQuestion.explanation}`;
        feedback.className = "feedback success";
      } else {
        feedback.textContent = `Needs review. ${currentQuestion.explanation}`;
        feedback.className = "feedback neutral";
      }

      scoreText.textContent = `Auto-graded score: ${score}`;

      review.push({
        type: currentQuestion.type,
        question: currentQuestion.question,
        selectedAnswer: userAnswer,
        correctAnswer: currentQuestion.acceptedAnswers ? currentQuestion.acceptedAnswers.join("; ") : "Instructor review recommended",
        isCorrect,
        explanation: currentQuestion.explanation
      });
    }

    function goToNextQuestion() {
      shortAnswer.disabled = false;

      if (currentQuestionIndex < quizQuestions.length - 1) {
        currentQuestionIndex += 1;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      quizCard.classList.add("hidden");
      document.querySelector(".reference-card").classList.add("hidden");
      resultCard.classList.remove("hidden");

      const percentage = Math.round((score / quizQuestions.length) * 100);
      finalScore.textContent = `${score} / ${quizQuestions.length} (${percentage}%)`;
      finalMessage.textContent = "Short-answer questions are auto-checked with simple matching. Review responses manually when precision matters.";

      reviewList.innerHTML = "";

      review.forEach((item, index) => {
        const reviewItem = document.createElement("div");
        reviewItem.className = "review-item";
        reviewItem.innerHTML = `
          <strong>${index + 1}. ${escapeHtml(item.question)}</strong>
          <p><strong>Response:</strong> ${escapeHtml(item.selectedAnswer)}</p>
          <p><strong>Expected:</strong> ${escapeHtml(item.correctAnswer)}</p>
          <p><strong>Status:</strong> ${item.isCorrect ? "Accepted" : "Needs review"}</p>
          <p>${escapeHtml(item.explanation)}</p>
        `;
        reviewList.appendChild(reviewItem);
      });
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      selectedAnswerIndex = null;
      score = 0;
      submitted = false;
      review.length = 0;
      shortAnswer.disabled = fals
      resultCard.classList.add("hidden");
      document.querySelector(".reference-card").classList.remove("hidden");
      quizCard.classList.remove("hidden");
      renderQuestion();
    }

    submitButton.addEventListener("click", submitAnswer);
    nextButton.addEventListener("click", goToNextQuestion);
    restartButton.addEventListener("click", restartQuiz);

    renderReferences();
    renderQuestion();
  </script>
</body>
</html>
